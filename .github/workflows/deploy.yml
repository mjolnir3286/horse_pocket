name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Skip rebuilds when a push only touches docs or the relay Worker
    # (the Worker deploys separately). Daily collector data deploys via
    # workflow_call from collect.yml, so it is not affected by this filter.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'apps/couch-relay/**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/portal/package-lock.json
            apps/couch/package-lock.json
            apps/wad/package-lock.json
            apps/shed/package-lock.json
      - name: Install and build portal
        working-directory: apps/portal
        run: |
          npm ci
          npm run build
      - name: Install, test, and build Couch
        working-directory: apps/couch
        run: |
          npm ci
          npm test
          npm run build
      - name: Install and build Wad
        working-directory: apps/wad
        run: |
          npm ci
          npm run build
      - name: Install, test, and build Shed
        working-directory: apps/shed
        run: |
          npm ci
          npm test
          npm run build
      - name: Assemble GitHub Pages site
        run: |
          rm -rf www
          mkdir -p www/couch www/wad www/shed
          cp -r apps/portal/dist/. www/
          cp -r apps/couch/www/. www/couch/
          cp -r apps/wad/dist/. www/wad/
          cp -r apps/shed/dist/. www/shed/
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
