name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/portal/package-lock.json
            apps/couch/package-lock.json
            apps/wad/package-lock.json
            apps/shed/package-lock.json
      - name: Install and build portal
        working-directory: apps/portal
        run: |
          npm ci
          npm run build
      - name: Install and build Couch
        working-directory: apps/couch
        run: |
          npm ci
          npm run build
      - name: Install and build Wad
        working-directory: apps/wad
        run: |
          npm ci
          npm run build
      - name: Install, test, and build Shed
        working-directory: apps/shed
        run: |
          npm ci
          npm test
          npm run build
      - name: Assemble GitHub Pages site
        run: |
          rm -rf www
          mkdir -p www/couch www/wad www/shed
          cp -r apps/portal/dist/. www/
          cp -r apps/couch/www/. www/couch/
          cp -r apps/wad/dist/. www/wad/
          cp -r apps/shed/dist/. www/shed/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
